<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>izfast</title>
<style>
:root { --bg: #05070a; --panel: #0c0f15; --card: #11151d; --line: #1d2330; --text: #e8ebf1; --dim: #8b93a3; --chip: #ff8a3d; --mac: #6aa9ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
body { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: 100vh; overflow: hidden; }
#view { position: relative; overflow: hidden; cursor: grab; }
#view:active { cursor: grabbing; }
#view canvas { display: block; }
#title { position: absolute; top: 18px; left: 22px; pointer-events: none; }
#title h1 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -.01em; }
#title p { margin: 3px 0 0; color: var(--dim); font-size: 13px; }
#viewi { position: absolute; top: 22px; right: 20px; }
#legend { position: absolute; left: 22px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--dim); font-size: 12px; pointer-events: none; }
#legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
#tip { position: absolute; pointer-events: none; max-width: 280px; background: rgba(12, 15, 21, .96); border: 1px solid #2a3344; border-radius: 8px; padding: 9px 11px; font-size: 12.5px; display: none; }
#tip b { display: block; margin-bottom: 3px; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 10px; }
aside > * { flex-shrink: 0; }
#ask { display: flex; gap: 8px; }
#prompt { flex: 1; resize: none; height: 46px; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 15px; outline: none; }
#prompt:focus { border-color: #3a4558; }
#go { padding: 0 20px; border: 0; border-radius: 11px; background: var(--chip); color: #1b0d04; font: inherit; font-weight: 700; cursor: pointer; }
#go:disabled { opacity: .5; cursor: progress; }
#examples { display: flex; flex-wrap: wrap; gap: 6px; }
#examples button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 14px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; text-align: left; }
#examples button:hover, #examples button.on { color: var(--text); border-color: #3a4558; }
#local { display: none; color: var(--dim); font-size: 12.5px; }
#local a { color: var(--chip); text-decoration: none; }
#local a:hover { text-decoration: underline; }
#status { color: var(--dim); font-size: 12.5px; min-height: 18px; display: flex; gap: 10px; align-items: center; }
#replay { display: none; background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 2px 9px; font: inherit; font-size: 12px; cursor: pointer; }
.side { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.who { font-weight: 650; font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
.tps { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tps b { font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
.tps small { color: var(--dim); font-size: 12px; margin-left: 4px; }
.chip .who, .chip .tps b { color: var(--chip); }
.mac .who, .mac .tps b { color: var(--mac); }
.bar { height: 3px; border-radius: 2px; background: #1a202b; overflow: hidden; margin: 8px 0 7px; }
.bar div { height: 100%; width: 0; }
.chip .bar div { background: var(--chip); }
.mac .bar div { background: var(--mac); }
.stats { display: flex; flex-wrap: wrap; gap: 3px 14px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 600; }
.text { margin-top: 8px; min-height: 54px; max-height: 160px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.5; color: #d5dae3; }
#verdict { text-align: center; min-height: 34px; padding-bottom: 8px; font-variant-numeric: tabular-nums; }
#verdict b { font-size: 26px; font-weight: 800; background: linear-gradient(90deg, var(--chip), var(--mac)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#verdict span { display: block; color: var(--dim); font-size: 12px; }
#settings { border-top: 1px solid var(--line); padding-top: 4px; }
.set { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 2px 10px; padding: 8px 0; }
.set label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; background: #0b0e13; color: var(--dim); border: 1px solid var(--line); border-radius: 8px; padding: 5px 2px; font: inherit; font-size: 12.5px; cursor: pointer; }
.seg button.on { color: var(--text); border-color: #4a5568; background: #1a2130; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.val { grid-column: 2; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.val b { color: var(--text); font-weight: 600; }
.i { width: 17px; height: 17px; border-radius: 50%; border: 1px solid #3a4352; background: rgba(5, 7, 10, .6); color: var(--dim); font: italic 700 11px/15px Georgia, serif; padding: 0; cursor: pointer; flex: none; }
.i:hover, .i.on { color: var(--text); border-color: var(--dim); }
#pop { position: fixed; z-index: 10; width: 300px; background: #141925; border: 1px solid #2c3546; border-radius: 10px; padding: 11px 13px; font-size: 13px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); display: none; }
#pop b { display: block; margin-bottom: 4px; }
#pop p { margin: 0 0 6px; color: #c3cad6; }
#pop p:last-child { margin: 0; }
#foot { margin-top: auto; color: var(--dim); font-size: 12px; }
#foot { display: flex; justify-content: space-between; align-items: center; }
#foot a { color: var(--dim); }
#stop { display: none; background: none; border: 1px solid #5a2a2a; color: #e08080; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
#stop:hover { background: #2a1414; }
@media (max-width: 900px) {
  body { display: block; height: auto; overflow: auto; }
  #view { height: 58vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view">
  <div id="title"><h1>izfast</h1><p>A chip that runs Llama 3.2 1B as fast as it can</p></div>
  <button class="i" id="viewi" data-i="view">i</button>
  <div id="legend"><span><i style="background:#4a86d8"></i>weight memory</span><span><i style="background:#ff8a3d"></i>multipliers</span><span><i style="background:#3dffa8"></i>vector unit</span><span><i style="background:#c77dff"></i>attention</span><span><i style="background:#ffe066"></i>buffers</span></div>
  <div id="tip"></div>
</div>
<aside>
  <form id="ask"><textarea id="prompt" maxlength="1500" placeholder="Ask anything"></textarea><button id="go">Ask</button></form>
  <div id="examples"></div>
  <div id="local">Want to try your own prompt? <a href="https://github.com/axelizsak/izfast#running-it">Try it locally</a></div>
  <div id="status"><span id="msg"></span><button id="replay">Replay</button></div>
  <section class="side chip">
    <div class="head"><span class="who">izfast chip <button class="i" data-i="chip">i</button></span><span class="tps"><b id="c_tps">-</b><small>tokens/s</small></span></div>
    <div class="bar"><div id="c_bar"></div></div>
    <div class="stats"><span>first token <b id="c_ttft">-</b></span><span>total <b id="c_total">-</b></span><span><b id="c_cyc">-</b> cycles/token</span></div>
    <div class="text" id="c_text"></div>
  </section>
  <section class="side mac">
    <div class="head"><span class="who"><span id="m_who">Your Mac</span> <button class="i" data-i="mac">i</button></span><span class="tps"><b id="m_tps">-</b><small>tokens/s</small></span></div>
    <div class="bar"><div id="m_bar"></div></div>
    <div class="stats"><span>first token <b id="m_ttft">-</b></span><span>total <b id="m_total">-</b></span><span id="m_hw"></span></div>
    <div class="text" id="m_text"></div>
  </section>
  <div id="verdict"></div>
  <div id="settings">
    <div class="set"><label>Lanes <button class="i" data-i="lanes">i</button></label><div class="seg" id="s_lanes"></div><div class="val" id="v_lanes"></div></div>
    <div class="set"><label>Weight bits <button class="i" data-i="wbits">i</button></label><div class="seg" id="s_wbits"></div><div class="val" id="v_wbits"></div></div>
    <div class="set"><label>Process <button class="i" data-i="node">i</button></label><div class="seg" id="s_node"></div><div class="val" id="v_node"></div></div>
  </div>
  <div id="foot"><a href="https://github.com/axelizsak/izfast">github.com/axelizsak/izfast</a><button id="stop">Stop demo</button></div>
</aside>
<div id="pop"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const $ = id => document.getElementById(id);
const S = { lanes: 1024, wbits: 4, node: "asap7" };
const OPTS = { lanes: [256, 1024], wbits: [4, 8], node: ["sky130hd", "asap7"] };
const NODE = { sky130hd: "130 nm", asap7: "7 nm" };
const UNIT = { mvu: "matrix unit", vpu: "vector unit", attn: "attention unit" };
let info = null, job = null, runs = null, sel = -1, raf = 0, shown = false, burstUntil = 0;

const INFO = {
  chip: () => ["izfast chip", "This chip is not manufactured. Its answer comes from an exact model of its arithmetic, checked bit for bit against the simulation of its circuit running Llama 3.2 1B.",
    "Its time is real: the clock cycles counted in that simulation for every token, divided by the clock frequency of the synthesized circuit."
    + (job && job.emu_seconds ? ` Computing this answer on your CPU took ${job.emu_seconds} s.` : "")],
  mac: () => runs
    ? [info.cpu, `Recorded on an ${info.cpu} laptop: llama.cpp on its GPU (Metal), same model, same question, same weight precision as the chip.`,
       "Run the project on your own computer to race it with your own questions."]
    : ["Your Mac", `Measured live on ${info ? info.cpu : "your Mac"}: llama.cpp on the GPU (Metal), same model, same question, same weight precision as the chip.`],
  lanes: () => ["Lanes", "A lane is a small compute unit with its own memory bank. The model's weights are split across all lanes.",
    "Every clock cycle, each lane reads 32 weights and multiplies them with the input. More lanes: more weights per cycle, fewer cycles per token, but a bigger chip."],
  wbits: () => ["Weight bits", "How many bits store each weight in the chip's memory.",
    "4 bits needs half the memory of 8 bits, so a smaller chip, and the answer changes slightly. The speed is the same: a lane reads one group of 32 weights per cycle either way."],
  node: () => ["Process", "The manufacturing technology. 130 nm is SkyWater's open process. 7 nm is ASAP7, a research model of a modern 7 nm process.",
    "Smaller transistors switch faster, so the same circuit runs at a higher clock. The clock is measured: the circuit is synthesized into logic gates and its slowest path is timed.", timed()],
  view: () => ["The chip", "A sketch of the floor plan: lanes with their weight banks and multipliers, the vector unit, the attention unit with its key-value cache, and the buffers. The light shows data moving between them.",
    "Drag to turn it, scroll to zoom, hover a block to see what it does. Not to scale: the weight memory takes most of the real area."],
};

function unitClocks(lanes = S.lanes, node = S.node) {
  const c = info && info.clocks[node] || {}, t = info && info.cycles[lanes], vk = t ? t.vk : 1;
  return Object.keys(UNIT).map(u => ({ u, f: c[`${u}_vk${vk}`] || c[u], small: vk > 1 && u !== "mvu" && !c[`${u}_vk${vk}`] }));
}

function timed() {
  const k = unitClocks(), fmt = x => `${UNIT[x.u]} ${Math.round(x.f).toLocaleString("en-US")} MHz${x.small ? " (timed on a smaller version)" : ""}`;
  const done = k.filter(x => x.f).map(fmt), todo = k.filter(x => !x.f).map(x => UNIT[x.u]);
  return `Measured at ${NODE[S.node]}: ${done.join(", ") || "nothing yet"}.` + (todo.length ? ` Not timed yet: ${todo.join(", ")}.` : " The chip runs at the slowest one.");
}

const pop = $("pop");
let popKey = null;
const closePop = () => { pop.style.display = "none"; popKey = null; document.querySelectorAll(".i.on").forEach(x => x.classList.remove("on")); };
document.addEventListener("click", e => {
  const b = e.target.closest(".i");
  if (!b || popKey === b.dataset.i) { closePop(); return; }
  closePop();
  const [title, ...ps] = INFO[b.dataset.i]();
  pop.innerHTML = `<b>${title}</b>` + ps.map(p => `<p>${p}</p>`).join("");
  pop.style.display = "block";
  const r = b.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left - 12, innerWidth - pop.offsetWidth - 8)) + "px";
  pop.style.top = Math.min(r.bottom + 8, innerHeight - pop.offsetHeight - 8) + "px";
  b.classList.add("on");
  popKey = b.dataset.i;
});
document.querySelector("aside").addEventListener("scroll", closePop);

const fmtT = ms => ms == null ? "-" : ms < 1 ? ms.toFixed(2) + " ms" : ms < 1000 ? ms.toFixed(ms < 10 ? 1 : 0) + " ms" : (ms / 1000).toFixed(2) + " s";
const fmtN = n => n == null ? "-" : Math.round(n).toLocaleString("en-US");
const mhz = (lanes = S.lanes, node = S.node) => { const f = unitClocks(lanes, node).map(x => x.f); return f.every(x => x) ? Math.min(...f) : 0; };
const table = () => info && info.cycles[S.lanes];
const cyc = p => { const t = table().cycles; return t[Math.min(t.length - 1, Math.floor(p / info.at))]; };
const tps = t => t.length > 1 ? (t.length - 1) / ((t[t.length - 1] - t[0]) / 1000) : 1000 / t[0];

function chipTimes(P, n) {
  const f = mhz() * 1e3;
  let c = 0;
  for (let p = 0; p < P; p++) c += cyc(p);
  const t = [c / f];
  for (let k = 1; k < n; k++) { c += cyc(P - 1 + k); t.push(c / f); }
  return t;
}

function segs() {
  for (const [k, vals] of Object.entries(OPTS)) {
    const el = $("s_" + k);
    el.innerHTML = vals.map(v => `<button data-v="${v}">${k === "node" ? NODE[v] : k === "wbits" ? v + "-bit" : v.toLocaleString("en-US")}</button>`).join("");
    for (const b of el.children) {
      const v = k === "node" ? b.dataset.v : +b.dataset.v;
      if (k === "lanes" && info && !(info.cycles[v] && mhz(v))) b.disabled = true;
      if (k === "node" && info && !mhz(S.lanes, v)) b.disabled = true;
      b.classList.toggle("on", S[k] === v);
      b.onclick = () => {
        S[k] = v;
        segs();
        if (k === "lanes") build();
        if (k === "wbits" && runs && sel >= 0) play(sel);
        else update();
      };
    }
  }
}

function update() {
  if (!info) return;
  const f = mhz();
  $("v_lanes").innerHTML = `<b>${fmtN(32 * S.lanes)}</b> multiply-adds per cycle`;
  $("v_wbits").innerHTML = `<b>${(info.weight_bytes[S.wbits] / 1e9).toFixed(2)} GB</b> of weights on chip`;
  $("v_node").innerHTML = f ? `<b>${fmtN(f)} MHz</b> clock` : "not timed";
  if (!table() || !f) return;
  const P = job && job.prompt_len || 0;
  $("c_cyc").textContent = fmtN(cyc(P));
  if (!job || !job.chip) { $("c_tps").textContent = fmtN(f * 1e6 / cyc(0)); return; }
  const ct = chipTimes(P, job.chip.length);
  $("c_tps").textContent = fmtN(tps(ct));
  $("c_ttft").textContent = fmtT(ct[0]);
  $("c_total").textContent = fmtT(ct[ct.length - 1]);
  if (job.phase === "done" && job.mac_tps)
    $("verdict").innerHTML = `<b>${fmtN(tps(ct) / job.mac_tps)}× faster</b><span>${fmtN(tps(ct))} against ${fmtN(job.mac_tps)} tokens per second</span>`;
}

function reset() {
  for (const id of ["c_text", "m_text", "verdict", "c_ttft", "c_total", "m_ttft", "m_total", "m_tps", "m_hw"]) $(id).textContent = "";
  for (const id of ["c_bar", "m_bar"]) $(id).style.width = "0";
  cancelAnimationFrame(raf);
  shown = false;
}

function race(live) {
  cancelAnimationFrame(raf);
  burst(1000);
  const t0 = performance.now(), ct = chipTimes(job.prompt_len, job.chip.length);
  const step = () => {
    const now = performance.now() - t0, mt = job.mac_ms || [], mp = job.mac || [];
    let k = 0, j = 0;
    while (k < ct.length && ct[k] <= now) k++;
    while (j < mt.length && (live || mt[j] <= now)) j++;
    $("c_text").textContent = job.chip.slice(0, k).join("");
    $("c_bar").style.width = (100 * k / ct.length) + "%";
    $("m_text").textContent = mp.slice(0, j).join("");
    $("m_bar").style.width = Math.min(100, 100 * j / Math.max(1, job.phase === "done" ? mt.length : job.chip.length)) + "%";
    $("m_ttft").textContent = j ? fmtT(mt[0]) : "-";
    $("m_total").textContent = j ? fmtT(live || j === mt.length ? mt[j - 1] : now) : "-";
    $("m_tps").textContent = job.mac_tps && (live || j === mt.length) ? fmtN(job.mac_tps) : j > 1 ? fmtN(tps(mt.slice(0, j))) : "-";
    for (const el of [$("c_text"), $("m_text")]) el.scrollTop = el.scrollHeight;
    if ((live && job.phase === "mac") || k < ct.length || (!live && j < mt.length)) raf = requestAnimationFrame(step);
  };
  step();
}

function play(i) {
  sel = i;
  const r = runs[i], w = r[S.wbits];
  $("prompt").value = r.prompt;
  [...$("examples").children].forEach((b, k) => b.classList.toggle("on", k === i));
  reset();
  job = { phase: "done", prompt_len: r.prompt_len, chip: w.chip, mac: w.mac, mac_ms: w.mac_ms, mac_tps: w.mac_tps };
  $("m_hw").textContent = w.mac_engine;
  $("replay").style.display = "inline-block";
  $("msg").textContent = "Chip answer computed by the C emulator, bit for bit, replayed at the chip's speed";
  update();
  race(false);
}

async function poll() {
  job = await (await fetch("api/job")).json();
  const busy = job.phase === "chip" || job.phase === "mac";
  $("go").disabled = busy;
  $("replay").style.display = job.phase === "done" ? "inline-block" : "none";
  if (job.phase === "chip") {
    burst(400);
    $("msg").textContent = (job.log || "C emulator computing the chip's answer, bit for bit") + (job.chip_n ? ` · ${job.chip_n} tokens` : "");
  }
  if (job.phase === "mac") $("msg").textContent = job.log;
  if ((job.phase === "mac" || job.phase === "done") && !shown) { shown = true; update(); race(true); }
  if (job.phase === "done") { $("msg").textContent = ""; $("m_hw").textContent = job.mac_engine || ""; update(); }
  if (job.phase === "error") $("msg").textContent = "Error: " + job.log;
  if (busy) setTimeout(poll, 60);
}

$("ask").onsubmit = async e => {
  e.preventDefault();
  if (runs) { const i = runs.findIndex(r => r.prompt === $("prompt").value); play(i >= 0 ? i : Math.max(0, sel)); return; }
  if ($("go").disabled) return;
  reset();
  const r = await fetch("api/ask", { method: "POST", body: JSON.stringify({ prompt: $("prompt").value, wbits: S.wbits, tokens: 256 }) });
  if (r.ok) poll();
};
$("prompt").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); } };
$("stop").onclick = async () => {
  await fetch("api/stop", { method: "POST" }).catch(() => {});
  $("stop").disabled = true;
  $("go").disabled = true;
  $("msg").textContent = "Demo stopped. Run make demo to start it again.";
};
$("replay").onclick = () => { if (runs && sel >= 0) play(sel); else if (job && job.phase === "done") race(false); };

const view = $("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.Fog(0x05070a, 45, 90);
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
camera.position.set(16, 21, 24);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 12;
controls.maxDistance = 60;
controls.target.set(-0.5, -1.2, 0.6);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.addEventListener("start", () => controls.autoRotate = false);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x0b0c10, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(10, 25, 12);
scene.add(sun);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.85, 0.5, 0.32));
composer.addPass(new OutputPass());

const COL = { sram: [0x1d2940, 0x4a86d8], mac: [0x3a1a0c, 0xff8a3d], vpu: [0x12382a, 0x3dffa8], attn: [0x2c1a3a, 0xc77dff], kv: [0x221c33, 0x9b79e6], buf: [0x2e2a12, 0xffe066], seq: [0x1c1f26, 0xaeb6c6], emb: [0x1a2a3a, 0x7fd1ff] };
const PARTS = {
  sram: ["Weight memory", "One bank per lane, holding that lane's share of every weight matrix. It delivers 32 weights and their scale every cycle."],
  mac: ["Multipliers", "32 multipliers and an adder tree per lane: 32 weights times 32 inputs every cycle."],
  xbuf: ["Input buffer", "The input vector of the current matrix product, sent to every lane."],
  ybuf: ["Output buffer", "Results leave the lanes here while the lanes already compute the next rows."],
  vpu: ["Vector unit", "Normalization, activation, residual additions and the conversion to 8-bit numbers."],
  attn: ["Attention unit", "Position encoding and attention over every earlier token."],
  kv: ["Key-value cache", "What the model remembers of every earlier token, split in 32 banks so one read returns 32 tokens."],
  vmem: ["Vector memory", "The intermediate vectors of the current token."],
  seq: ["Sequencer", "Runs the fixed program of the model, the same for every token."],
  tbl: ["Lookup tables", "Square roots, exponentials, sigmoid and rotation angles."],
  emb: ["Embedding table", "One row per vocabulary token, read once per token."],
};
let chip = new THREE.Group(), units = {}, pickables = [], flow = null;
scene.add(chip);

function box(w, h, d, color, x, y, z, metal = 0.2, rough = 0.6) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rough }));
  m.position.set(x, y + h / 2, z);
  chip.add(m);
}

function grid(key, kind, n, cols, x0, z0, w, d, h, fill = 0.82, fz = fill, oz = 0) {
  const rows = Math.ceil(n / cols), cw = w / cols, cd = d / rows;
  const mat = ["sram", "kv", "emb"].includes(kind) ? new THREE.MeshStandardMaterial({ metalness: 0.45, roughness: 0.5 }) : new THREE.MeshBasicMaterial();
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(cw * fill, h, cd * fz), mat, n);
  const m4 = new THREE.Matrix4(), c = new THREE.Color(COL[kind][0]);
  for (let i = 0; i < n; i++) {
    m4.makeTranslation(x0 + cw * (i % cols + 0.5), 0.3 + h / 2, z0 + cd * (Math.floor(i / cols) + 0.5 + oz));
    mesh.setMatrixAt(i, m4);
    mesh.setColorAt(i, c);
  }
  mesh.userData = { key };
  chip.add(mesh);
  pickables.push(mesh);
  units[key] = { mesh, kind, n, cols };
}

const dot = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,1)");
  r.addColorStop(0.25, "rgba(255,255,255,0.8)");
  r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

function wires(lanesTop) {
  const Y = lanesTop + 0.25, y = 0.85, P = [];
  const add = (pts, color, n, speed = 1) => P.push({ pts: pts.map(p => new THREE.Vector3(...p)), color: new THREE.Color(color), n, speed });
  for (let k = 0; k < 12; k++) {
    const xa = -9.2 + 11.8 * (k + 0.25) / 12, xb = -9.2 + 11.8 * (k + 0.75) / 12;
    add([[xa, y, 3.33], [xa, Y, 2.6], [xa, Y, -9.0]], 0xffe9a0, 3);
    add([[xb, Y, -9.0], [xb, Y, 2.6], [xb, y, 3.98]], 0xff9a50, 3);
  }
  for (let k = 0; k < 6; k++) { const x = -8.4 + 10.2 * k / 5; add([[x, y, 4.0], [x, y, 5.2]], 0x5dffb8, 2, 0.6); }
  for (let k = 0; k < 3; k++) { const x = -7.5 + 4 * k; add([[x, y, 6.6], [x, y, 5.7]], 0x8fdcff, 1, 0.5); }
  add([[-8.8, y, 5.2], [-9.8, y, 5.2], [-9.8, y, 3.33], [2.4, y, 3.33]], 0xffe066, 4, 1.4);
  add([[2.6, y, 5.0], [3.35, y, 5.0], [3.35, y, 3.7], [8.8, y, 3.7]], 0x5dffb8, 3);
  add([[2.6, y, 4.7], [3.15, y, 4.7], [3.15, y, -6.9], [8.8, y, -6.9]], 0xd59bff, 4, 1.3);
  add([[8.8, y, -8.7], [2.95, y, -8.7], [2.95, y, 4.9], [2.4, y, 4.9]], 0xd59bff, 4, 1.3);
  for (let k = 0; k < 4; k++) {
    const x = 4.2 + 1.4 * k;
    add([[x, y, -4.9], [x, y, 1.7]], 0xb48cff, 2, 0.8);
    add([[x + 0.7, y, 1.7], [x + 0.7, y, -4.9]], 0xb48cff, 2, 0.8);
  }
  add([[4.9, y, 6.0], [4.9, y, 5.25], [-9.0, y, 5.25]], 0xf2f4f8, 2, 0.7);
  const parts = [];
  for (const p of P) {
    chip.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p.pts), new THREE.LineBasicMaterial({ color: p.color, transparent: true, opacity: 0.22 })));
    p.len = [0];
    for (let i = 1; i < p.pts.length; i++) p.len.push(p.len[i - 1] + p.pts[i].distanceTo(p.pts[i - 1]));
    for (let i = 0; i < p.n; i++) parts.push({ p, o: (i + Math.random()) / p.n });
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(parts.length * 3), 3));
  geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(parts.length * 3), 3));
  chip.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.42, map: dot, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
  return { parts, geo };
}

function build() {
  scene.remove(chip);
  chip.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  chip = new THREE.Group();
  scene.add(chip);
  units = {}; pickables = [];
  const m = info ? info.model : { n_layers: 16, n_kv_heads: 8, n_heads: 32 }, vk = table() ? table().vk : 4, rep = m.n_heads / m.n_kv_heads;
  box(25, 1.0, 25, 0x0b2a22, 0, -1.3, 0, 0.1, 0.9);
  box(20.6, 0.3, 20.6, 0x0d1015, 0, -0.3, 0, 0.5, 0.45);
  const pads = new THREE.InstancedMesh(new THREE.BoxGeometry(0.34, 0.08, 0.34), new THREE.MeshStandardMaterial({ color: 0x9c7e3a, metalness: 0.6, roughness: 0.55 }), 112);
  const m4 = new THREE.Matrix4();
  for (let s = 0, i = 0; s < 4; s++) for (let k = 0; k < 28; k++, i++) {
    const t = -9.45 + k * 0.7, e = 10.0, [x, z] = [[t, -e], [e, t], [-t, e], [-e, -t]][s];
    m4.makeTranslation(x, 0.04, z);
    pads.setMatrixAt(i, m4);
  }
  chip.add(pads);
  const cols = Math.ceil(Math.sqrt(S.lanes)), x0 = -9.2, z0 = -9.2, w = 11.8, d = 12, h = Math.max(0.25, Math.min(1.0, 9 / cols));
  grid("sram", "sram", S.lanes, cols, x0, z0, w, d, h, 0.86, 0.6, -0.14);
  grid("mac", "mac", S.lanes, cols, x0, z0, w, d, 0.12, 0.86, 0.2, 0.3);
  grid("xbuf", "buf", 1, 1, x0, 3.1, w, 0.45, 0.16, 0.98);
  grid("ybuf", "buf", 1, 1, x0, 3.75, w, 0.45, 0.16, 0.98);
  grid("vpu", "vpu", 32 * vk, 16 * vk, x0, 4.5, w, 1.4, 0.2, 0.8);
  grid("emb", "emb", 12, 12, x0, 6.4, w, 2.8, 0.45, 0.9);
  grid("attn", "attn", (info ? info.at : 32) * rep, info ? info.at : 32, 3.6, -9.2, 5.6, 4.6, 0.22, 0.8);
  grid("kv", "kv", m.n_layers * m.n_kv_heads, m.n_kv_heads * 2, 3.6, -4.2, 5.6, 6.2, 0.5, 0.9);
  grid("vmem", "sram", 8, 4, 3.6, 2.4, 5.6, 2.6, 0.4, 0.9);
  grid("seq", "seq", 2, 2, 3.6, 5.4, 2.6, 3.8, 0.3, 0.88);
  grid("tbl", "buf", 4, 2, 6.6, 5.4, 2.6, 3.8, 0.25, 0.86);
  flow = wires(0.3 + h);
}

const tip = $("tip"), ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener("pointermove", e => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (!hit) { tip.style.display = "none"; return; }
  const [name, txt] = PARTS[hit.object.userData.key];
  tip.innerHTML = `<b>${name}</b>${txt}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 290) + "px";
  tip.style.top = (e.clientY - r.top + 14) + "px";
});
renderer.domElement.addEventListener("pointerleave", () => tip.style.display = "none");

function burst(ms) { burstUntil = Math.max(burstUntil, performance.now() + ms); }

const tmp = new THREE.Color(), lo = new THREE.Color(), hi = new THREE.Color(), clock = new THREE.Clock(), v = new THREE.Vector3();
let level = 0.2, travel = 0, last = 0;
function paint(t) {
  const dt = Math.min(0.05, t - last);
  last = t;
  level += ((performance.now() < burstUntil ? 1 : 0.2) - level) * Math.min(1, dt * 3);
  travel += dt * (0.6 + 7 * level);
  for (const [key, u] of Object.entries(units)) {
    const lane = key === "sram" || key === "mac";
    lo.setHex(COL[u.kind][0]); hi.setHex(COL[u.kind][1]);
    for (let i = 0; i < u.n; i++) {
      const x = i % u.cols, z = Math.floor(i / u.cols);
      let a = lane ? level * (0.55 + 0.45 * Math.sin(t * 8 - x * 0.5 - z * 0.25)) : level * (0.45 + 0.35 * Math.sin(t * 5 + i * 0.9));
      a = Math.max(a, 0.07 + 0.05 * Math.sin(t * 1.3 + i * 0.7));
      tmp.copy(lo).lerp(hi, Math.min(1, a));
      u.mesh.setColorAt(i, tmp);
    }
    u.mesh.instanceColor.needsUpdate = true;
  }
  if (!flow) return;
  const pos = flow.geo.attributes.position.array, col = flow.geo.attributes.color.array, glow = 0.35 + 0.9 * level;
  flow.parts.forEach((q, i) => {
    const p = q.p, L = p.len[p.len.length - 1], s = ((q.o * L + travel * p.speed * 2.2) % L + L) % L;
    let k = 1;
    while (k < p.len.length - 1 && p.len[k] < s) k++;
    v.lerpVectors(p.pts[k - 1], p.pts[k], (s - p.len[k - 1]) / (p.len[k] - p.len[k - 1] || 1));
    pos[3 * i] = v.x; pos[3 * i + 1] = v.y; pos[3 * i + 2] = v.z;
    col[3 * i] = p.color.r * glow; col[3 * i + 1] = p.color.g * glow; col[3 * i + 2] = p.color.b * glow;
  });
  flow.geo.attributes.position.needsUpdate = true;
  flow.geo.attributes.color.needsUpdate = true;
}

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
(function loop() {
  controls.update();
  paint(clock.getElapsedTime());
  composer.render();
  requestAnimationFrame(loop);
})();

try {
  const r = await fetch("api/info");
  if (!r.ok) throw new Error();
  info = await r.json();
} catch {
  const d = await (await fetch("runs.json")).json();
  info = d.info;
  runs = d.runs;
}
if (!info.cycles[S.lanes]) S.lanes = +Object.keys(info.cycles)[0] || S.lanes;
if (!mhz()) S.node = OPTS.node.find(n => mhz(S.lanes, n)) || S.node;
const examples = runs ? runs.map(r => r.prompt) : info.examples || [];
$("examples").innerHTML = examples.map(x => `<button type="button">${x}</button>`).join("");
[...$("examples").children].forEach((b, i) => b.onclick = () => {
  if (runs) play(i);
  else { $("prompt").value = examples[i]; $("ask").requestSubmit(); }
});
if (runs) {
  $("prompt").readOnly = true;
  $("prompt").placeholder = "Pick a question below";
  $("m_who").textContent = info.cpu;
  $("local").style.display = "block";
}
if (!runs) $("stop").style.display = "inline-block";
segs(); build(); resize(); update();
if (runs) play(0);
else {
  const j = await (await fetch("api/job")).json();
  if (j.phase === "chip" || j.phase === "mac") poll();
}
</script>
</body>
</html>
